name: Build Nuvio Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-rewrite
    paths:
      - androidApp/**
      - composeApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/nuvio-offline-apk.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -n "${ANDROID_HOME:-}" || { echo 'ANDROID_HOME not configured'; exit 1; }
          test -d "$ANDROID_HOME" || { echo 'Android SDK directory missing'; exit 1; }
          echo "Using preinstalled Android SDK: $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare local Android configuration
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          echo 'Prepared local.properties without committing credentials'
      - name: Build installable Android APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Offline-Android-debug-${{ github.run_number }}
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 30
