name: Build Nuvio Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-rewrite
    paths:
      - androidApp/**
      - composeApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/nuvio-offline-apk.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -n "${ANDROID_HOME:-}" || { echo 'ANDROID_HOME not configured'; exit 1; }
          test -d "$ANDROID_HOME" || { echo 'Android SDK directory missing'; exit 1; }
          echo "Using preinstalled Android SDK: $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare local Android configuration
        env:
          NUVIO_SUPABASE_URL: https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
          NUVIO_SUPABASE_FALLBACK_URL: https://api-two.nuvioapp.space
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [[ -n "$NUVIO_SUPABASE_URL" && -n "$NUVIO_SUPABASE_ANON_KEY" ]]; then
            printf 'NUVIO_SUPABASE_URL=%s\nNUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_URL" "$NUVIO_SUPABASE_ANON_KEY" >> local.properties
            if [[ -n "$NUVIO_SUPABASE_FALLBACK_URL" ]]; then
              printf 'NUVIO_SUPABASE_FALLBACK_URL=%s\n' "$NUVIO_SUPABASE_FALLBACK_URL" >> local.properties
            fi
            echo 'Authentication backend configuration supplied via GitHub Secrets.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ No Supabase configuration supplied: account sign-in will not work in this APK.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$TMDB_API_KEY" ]]; then
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> local.properties
          fi
      - name: Build installable Android APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Offline-Android-debug-${{ github.run_number }}
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 30
