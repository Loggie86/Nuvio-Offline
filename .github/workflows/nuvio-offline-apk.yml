name: Build Nuvio Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - cmp-rewrite
    paths:
      - androidApp/**
      - composeApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/nuvio-offline-apk.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          test -n "${ANDROID_HOME:-}" || { echo 'ANDROID_HOME not configured'; exit 1; }
          test -d "$ANDROID_HOME" || { echo 'Android SDK directory missing'; exit 1; }
          echo "Using preinstalled Android SDK: $ANDROID_HOME"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare local Android configuration
        env:
          NUVIO_SUPABASE_URL: https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
          NUVIO_SUPABASE_FALLBACK_URL: https://api-two.nuvioapp.space
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          if [[ -n "$NUVIO_SUPABASE_URL" && -n "$NUVIO_SUPABASE_ANON_KEY" ]]; then
            printf 'NUVIO_SUPABASE_URL=%s\nNUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_URL" "$NUVIO_SUPABASE_ANON_KEY" >> local.properties
            if [[ -n "$NUVIO_SUPABASE_FALLBACK_URL" ]]; then
              printf 'NUVIO_SUPABASE_FALLBACK_URL=%s\n' "$NUVIO_SUPABASE_FALLBACK_URL" >> local.properties
            fi
            echo 'Authentication backend configuration supplied via GitHub Secrets.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ No Supabase configuration supplied: account sign-in will not work in this APK.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$TMDB_API_KEY" ]]; then
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> local.properties
          fi
      - name: Restore stable Android signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nuvio-offline-android-debug-signing-v1
      - name: Prepare stable debug key
        env:
          KEYSTORE_B64: ${{ secrets.NUVIO_OFFLINE_SIGNING_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          elif [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Nuvio Offline,O=Logan Home,C=AU'
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep 'SHA256:' >> "$GITHUB_STEP_SUMMARY"
      - name: Export debug keystore path
        run: echo "NUVIO_OFFLINE_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Build installable Android APK
        run: |
          echo 'CI keystore certificate:'
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:'
          ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs androidApp/build/outputs/apk/full/debug/*.apk | grep 'Signer #1 certificate SHA-256 digest'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Offline-Android-debug-${{ github.run_number }}
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 30
